# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# Names keep the host hooks independent of a recompiled address.
[names]
PsiOpsGameStatusInit                            = 0xDA750
PsiOpsReadProfile                               = 0xDBF50
PsiOpsWriteProfile                              = 0xDC090
PsiOpsCommitOptions                             = 0xDD0D0
PsiOpsPlayerTakeDamage                          = 0xFEF40
PsiOpsCharacterTakeDamage                       = 0x1FBE0

# Binary-verified CRI ADX spin-blocker thread (0x003FFCF0..0x003FFD12) cooperative suspend hook
[[hook]]
at = 0x3FFD00
call = "Hook_AdxSpinYield"

# Binary-verified Psi-Ops Native-PC Mouse & Keyboard direct camera aim hooks:
# 1. Camera::ApplyManualAim (3rd-person, Sniper Scope, Mind Control, Telekinesis look)
[[hook]]
at = 0x04EED0
call = "Hook_CameraApplyManualAim"

# 2. PsiPower::RemoteViewUpdate -> QuatFromEuler (Remote View camera look)
[[hook]]
at = 0x115E3C
call = "Hook_RemoteViewAim"

# 3. Player::UpdateTKPitch (Telekinesis held-object vertical pitch elevation)
[[hook]]
at = 0x0FC680
call = "Hook_UpdateTKPitch"

# 4. Camera::AutoSteerToPoint (Raw 1:1 Aim auto-steer / lock-on bypass)
[[hook]]
at = 0x04F4F0
call = "Hook_CameraAutoSteerBypass"
on_true = "ret"

# 5. HUD::Update (Full PC Mouse point-and-click menu hover, LMB confirm/slider, RMB back, wheel nav)
[[hook]]
at = 0x0C1040
call = "Hook_HudUpdate"

# 6. InputManager::Update (per-guest-frame M&K edge/wheel/Psi snapshot & instant Manual Reload)
[[hook]]
at = 0x294130
call = "Hook_InputManagerUpdate"

# 7. InputManager::GetActionValue (100% engine-level decoupled M&K Action ID override, ret 4)
[[hook]]
at = 0x294160
call = "Hook_InputManagerGetActionValue"
on_true = "ret"
